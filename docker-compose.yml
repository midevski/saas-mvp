services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - '4000:4000'
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    volumes:
      - ./server:/app
      - /app/node_modules
      # Card images (local storage driver) survive `docker compose down` / `up`
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    depends_on:
      - server
    env_file:
      - .env
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongo_data:
  uploads_data:
