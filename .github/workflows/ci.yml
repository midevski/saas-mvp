name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older, now-irrelevant run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  server-tests:
    name: Server tests (Jest + Supertest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Otherwise it downloads into node_modules/.cache, which `npm ci` wipes every run
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      # mongodb-memory-server downloads its own MongoDB binary — no service container needed.
      # Caching it saves that download on most runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  client-lint-build:
    name: Client lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright against docker compose)
    runs-on: ubuntu-latest
    # Only run the slow layer once the fast checks pass
    needs: [server-tests, client-lint-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml reads the root .env. Secrets come from repo settings and are never
      # committed; they're passed via env (not inlined into the script) so values are never
      # interpolated into shell source.
      - name: Write .env for the compose stack
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
        run: |
          for name in JWT_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID_PRO; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; exit 1; fi
          done
          {
            echo "NODE_ENV=development"
            echo "PORT=4000"
            echo "MONGO_URI=mongodb://mongo:27017/saas-mvp"
            echo "REDIS_URL=redis://redis:6379"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            echo "STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
            echo "STRIPE_PRICE_ID_PRO=$STRIPE_PRICE_ID_PRO"
            echo "CLIENT_URL=http://localhost:5173"
            echo "VITE_API_PROXY_TARGET=http://server:4000"
          } > .env

      # Fresh containers (and a fresh Mongo) on every run, so there's no test data to clean up
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the stack to be healthy
        run: |
          # Server health directly, then through the client's /api proxy (proves the wiring)
          for url in http://localhost:4000/health http://localhost:5173/api/health; do
            echo "Waiting for $url"
            for i in $(seq 1 60); do
              if curl -fsS "$url" > /dev/null; then echo "  up after ${i} tries"; continue 2; fi
              sleep 2
            done
            echo "::error::$url did not become healthy"
            exit 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Playwright
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: client
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO(Phase 7): production Dockerfiles don't exist yet. Until they do, building the dev
      # images is a smoke test that both images still build from a clean checkout.
      - name: Build server image
        run: docker build -f server/Dockerfile.dev -t saas-mvp-server:ci server
      - name: Build client image
        run: docker build -f client/Dockerfile.dev -t saas-mvp-client:ci client
